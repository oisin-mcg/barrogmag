backend:
  name: github
  repo: oisin-mcg/barrogmag
  branch: main
  base_url: https://barrog-cms-auth.mcgillicuddyoisin.workers.dev
  

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: site
    label: Site Settings
    files:
      - name: settings
        label: Countdown
        file: src/content/site/settings.json
        format: json
        fields:
          - { label: Next release title, name: nextReleaseTitle, widget: string }
          - { label: Next release date, name: nextReleaseDate, widget: datetime }
          - label: Issue to reveal when countdown reaches zero
            name: nextReleaseIssue
            widget: relation
            collection: issues
            search_fields: ["title", "slug"]
            value_field: slug
            display_fields: ["title"]
            required: false
            hint: "Upload the next issue first, leave Current issue off, then choose it here."
          - { label: Upcoming message, name: upcomingMessage, widget: text }
          - { label: Release message, name: releaseMessage, widget: text }

  - name: pages
    label: Pages
    files:
      - name: about
        label: About Page
        file: src/content/pages/about.json
        format: json
        fields:
          - { label: Title, name: title, widget: string }
          - label: Intro
            name: intro
            widget: list
            field: { label: Paragraph, name: paragraph, widget: text }
          - { label: Note, name: note, widget: text, required: false }
          - { label: Contributors title, name: contributorsTitle, widget: string }
          - label: Contributors
            name: contributors
            widget: list
            summary: "{{fields.nameAndTitle}}"
            fields:
              - { label: Image, name: image, widget: image }
              - { label: Name and title, name: nameAndTitle, widget: string, hint: "Example: Oisin -- Web Designer" }
              - { label: Body, name: body, widget: text }

  - name: issues
    label: Issues
    label_singular: Issue
    folder: src/content/issues
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}}"
    fields:
      - { label: ID, name: id, widget: string, hint: "Example: issue-02" }
      - { label: Slug, name: slug, widget: string, hint: "Example: issue-02" }
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Issue publication date, name: releaseDate, widget: datetime }
      - { label: Cover image, name: coverImage, widget: image }
      - { label: PDF file, name: pdfPath, widget: file, media_library: { config: { multiple: false } } }
      - { label: Current issue, name: isCurrent, widget: boolean, required: false, default: false }

  - name: authors
    label: Editors and Authors
    label_singular: Author
    folder: src/content/authors
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{name}}"
    fields:
      - { label: Slug, name: slug, widget: string, hint: "Lowercase, no spaces. Example: ella" }
      - { label: Name, name: name, widget: string }
      - { label: Role, name: role, widget: string }
      - { label: Profile photo, name: photo, widget: image }
      - { label: Bio, name: bio, widget: text, required: false }

  - name: blog
    label: Blog Posts
    label_singular: Blog Post
    folder: src/content/blog
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}}"
    fields:
      - { label: Slug, name: slug, widget: string, hint: "Lowercase URL text. Example: issue-two-launch" }
      - { label: Title, name: title, widget: string }
      - { label: Excerpt, name: excerpt, widget: text }
      - { label: Date, name: publishedAt, widget: datetime }
      - { label: Cover photo, name: coverImage, widget: image, required: false }
      - { label: Cover photo alt text, name: coverImageAlt, widget: string, required: false }
      - label: Author
        name: author
        widget: relation
        collection: authors
        search_fields: ["name", "role"]
        value_field: slug
        display_fields: ["name"]
      - label: Body
        name: body
        widget: list
        field: { label: Paragraph, name: paragraph, widget: text }
      - label: Photos
        name: photos
        widget: list
        required: false
        summary: "{{fields.caption}}"
        fields:
          - { label: Photo, name: image, widget: image }
          - { label: Alt text, name: alt, widget: string, required: false }
          - { label: Caption, name: caption, widget: string, required: false }
